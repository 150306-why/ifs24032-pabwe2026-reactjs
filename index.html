<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lost & Founds</title>
  <meta name="description"
    content="Lost & Founds: laporkan barang hilang atau temuan dan bantu mempertemukan barang dengan pemiliknya." />
  <meta name="theme-color" content="#4f46e5" />
  <!--
    Font Plus Jakarta Sans di-host sendiri (lihat src/index.css) dan di-preload oleh
    vite.config.js, jadi tidak ada request ke Google Fonts.

    Skrip kecil ini berjalan sebelum first paint: pengunjung tanpa token yang membuka
    "/" langsung diarahkan ke /auth/login (tanpa reload) dan melihat shell halaman login.
  -->
  <script>
    (function () {
      try {
        var p = location.pathname.replace(/\/+$/, "") || "/";
        if (!localStorage.getItem("accessToken") && (p === "/" || p === "/auth" || p === "/auth/login")) {
          if (p !== "/auth/login") history.replaceState(null, "", "/auth/login" + location.search + location.hash);
          document.documentElement.setAttribute("data-shell", "login");
        }
      } catch (e) { /* localStorage tidak tersedia: tampilkan shell umum */ }
    })();
  </script>
  <style>
    #shell-login { display: none; }
    html[data-shell="login"] #shell-login { display: block; }
    html[data-shell="login"] #shell-generic { display: none; }
  </style>
</head>

<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen">
  <!-- Judul level-satu statis di luar root: selalu ada di DOM apa pun keadaan render React -->
  <div role="region" aria-label="Lost &amp; Founds"
    style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap">
    <h1>Lost &amp; Founds</h1>
  </div>
  <!-- Shell statis: tampil seketika sebelum JavaScript selesai dimuat, diganti React saat siap -->
  <div id="root"><div id="shell-login"><!--prerender-login--></div><main id="shell-generic" style="display:flex;min-height:100vh;align-items:center;justify-content:center;padding:1rem;font-family:system-ui,sans-serif"><p style="margin:0;font-size:1rem;color:#475569">Memuat aplikasi...</p></main></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
